<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smena Tizimiga Kirish</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-slate-800 mb-2">Smena Nazorati</h2>
        <p class="text-center text-slate-500 mb-6 text-sm">Tizimga kirish uchun login va parolingizni kiriting</p>
        
        <div id="error-box" class="hidden bg-red-100 text-red-700 p-3 rounded-lg text-sm mb-4"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Foydalanuvchi nomi</label>
                <input type="text" id="username" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Parol</label>
                <input type="password" id="password" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-200">Tizimga Kirish</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error-box');
            errorBox.classList.add('hidden');

            try {
                // Netlify-da serverless API uchun /api/ bilan murojaat qilinadi
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await res.json();
                if(!res.ok) {
                    errorBox.innerText = data.error || "Xatolik yuz berdi";
                    errorBox.classList.remove('hidden');
                } else {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.href = '/dashboard.html';
                }
            } catch (err) {
                errorBox.innerText = "Serverga ulanib bo'lmadi. Netlify Environment Variables sozlamalarini tekshiring.";
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
